[package]
name = "stars-server"
version = "0.1.0"
edition = "2021"

# Headless HTTP host (ROADMAP L-22). Wraps the shared render pipeline from
# `crates/common::render` in an axum HTTP envelope so the same scene JSON
# the CLI reads from disk can be POSTed for a PNG response. The render
# code itself is not duplicated here — see `crates/common/src/render.rs`.

[[bin]]
name = "stars-server"
path = "src/main.rs"

[dependencies]
stars-host-common = { path = "../../crates/common" }
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = "0.5"
serde = { workspace = true }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
log = { workspace = true }
pollster = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json"] }
