[package]
name = "stars-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stars-core = { path = "../../crates/stars-core" }
stars-catalog = { path = "../../crates/stars-catalog", default-features = false, features = ["embedded"] }
wgpu = "29"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Document", "Window", "HtmlCanvasElement", "Element",
    "MouseEvent", "WheelEvent", "EventTarget",
] }
console_error_panic_hook = "0.1"
console_log = "1"
log = "0.4"
glam = { version = "0.30", features = ["bytemuck"] }
js-sys = "0.3"
