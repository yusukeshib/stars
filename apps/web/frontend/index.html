<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stars</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #root { width: 100%; height: 100%; }

      /*
       * L-24 accessibility (WCAG 2.2 AA). Inline component styles can't express
       * pseudo-classes, so the cross-cutting a11y rules live here.
       */

      /* WCAG 2.4.7 Focus Visible: a high-contrast ring on every keyboard-
         focused control. Pointer focus stays ring-free via :focus-visible. */
      :focus-visible {
        outline: 2px solid #9cc4ff;
        outline-offset: 2px;
        border-radius: 3px;
      }
      /* The canvas owns the whole viewport; inset its ring so it stays visible. */
      #star-canvas:focus-visible { outline-offset: -3px; }

      /* Screen-reader-only text: present to assistive tech, invisible on screen. */
      .sr-only {
        position: absolute !important;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0, 0, 0, 0);
        white-space: nowrap; border: 0;
      }

      /* WCAG 2.3.3 Animation from Interactions: honour reduced-motion. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
      }

      /* WCAG 1.4.11 / forced-colors: keep focus rings strong when the user
         requests higher contrast or a forced-colors palette. */
      @media (prefers-contrast: more) {
        :focus-visible { outline-width: 3px; }
      }
      @media (forced-colors: active) {
        :focus-visible { outline: 3px solid CanvasText; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
