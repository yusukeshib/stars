[package]
name = "stars-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stars"
path = "src/main.rs"

[[example]]
name = "session-table"
path = "examples/session_table.rs"

[dependencies]
renderer = { path = "../../crates/renderer" }
astronomy = { path = "../../crates/astronomy" }
stars-host-common = { path = "../../crates/common" }
pollster = "0.4"
env_logger = "0.11"
log = { workspace = true }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
