[package]
name = "stars-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
renderer = { path = "../../crates/renderer" }
catalog = { path = "../../crates/catalog", features = ["filesystem"] }
astronomy = { path = "../../crates/astronomy" }
wgpu = { workspace = true }
glam = { workspace = true }
log = { workspace = true }
winit = "0.30"
pollster = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
