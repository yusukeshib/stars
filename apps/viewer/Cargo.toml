[package]
name = "stars-viewer"
version = "0.1.0"
edition = "2021"

[dependencies]
renderer = { path = "../../crates/renderer" }
catalog = { path = "../../crates/catalog", features = ["filesystem"] }
astronomy = { path = "../../crates/astronomy" }
stars-host-common = { path = "../../crates/common" }
wgpu = { workspace = true }
log = { workspace = true }
winit = "0.30"
pollster = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
