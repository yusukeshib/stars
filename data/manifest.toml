# Machine-readable data provenance manifest for `stars`.
#
# Companion to DATA_SOURCES.md: the manifest is the source-of-truth shape that
# CI verifies, while DATA_SOURCES.md is the human-readable narrative. Every
# committed data artifact, every generated/regenerable artifact, and every
# runtime web service the application calls must have an entry here.
#
# Rules:
#
# 1. Adding or changing any data file in the repository requires updating its
#    entry in this file in the same PR. `make manifest-check` (wired into
#    `make ci`) recomputes SHA-256s and fails on drift.
# 2. `kind` controls which fields are required (see crates/manifest/src/lib.rs):
#    - `embedded`        — third-party data checked into the repo. Requires
#                          `path`, `sha256`. SHA-256 pins the upstream snapshot
#                          a release was built against.
#    - `generated`       — produced from project sources by a documented
#                          command and checked in for reproducibility. Requires
#                          `path`, `sha256`, and `preprocessing` so the
#                          regenerator is discoverable.
#    - `runtime-service` — endpoint called at runtime. No local bytes; requires
#                          `endpoint`.
# 3. `id` must be stable across PRs — JSON sessions and the catalog backend
#    cite artifacts by id (see ARCHITECTURE.md "catalog backend identity").
# 4. `license` is the SPDX identifier where one applies. Use `"public-domain"`
#    or `"see-upstream"` when no SPDX value fits.

schema_version = 1

