[[artifact]]
id = "messier-catalog"
description = "110 Messier deep-sky objects: J2000 positions, magnitudes, sizes, and classifications."
kind = "embedded"
path = "crates/catalog/data/messier.csv"
sha256 = "6c85285c94b299afe0cbc1b172467421b2fbb27e07305910d30822eb651895e8"
bytes = 6505
source = "https://github.com/mattiaverga/OpenNGC"
archive_id = "OpenNGC database_files/NGC.csv (Messier subset)"
citation = "Sinnott & Skiff 1988, NGC 2000.0 (VizieR VII/118); SEDS Messier database (https://www.messier.seds.org/) for M40 / M45 / M102 backfill."
version = "OpenNGC main snapshot 2024"
retrieved = "2026-05"
license = "public-domain"
license_url = "https://github.com/mattiaverga/OpenNGC/blob/master/LICENSE"
preprocessing = """
Extracted the Messier subset of OpenNGC's NGC.csv (rows where the `M`
column is set), kept only the factual numerical columns (J2000 RA, J2000
Dec, V magnitude, major-axis size, type, NGC id), normalised type strings
to OC / GC / G / N / PN / SNR / Other, then added M40 (Winnecke 4), M45
(Pleiades, no NGC id), and M102 (= NGC 5866) from NGC 2000.0 / SEDS
standard values. The catalog crate's build script compacts this CSV into
the i16 binary `messier.bin` consumed by `catalog::deepsky`; the renderer
build script additionally bakes the `M1`..`M110` label table out of the
same source.

Only facts (coordinates, brightness measurements, angular sizes) are
retained, so the resulting subset is treated as public-domain factual data
with OpenNGC acknowledged as the upstream compilation; see
DATA_SOURCES.md for the per-row caveats.
"""
fields_used = ["m", "ngc", "ra_hours", "dec_deg", "mag", "type", "size_arcmin"]
used_by = [
    "crates/catalog/build.rs",
    "crates/catalog/src/deepsky.rs",
    "crates/renderer/build.rs",
    "crates/renderer/src/overlay.rs",
    "crates/renderer/src/text.rs",
]
limitations = """
Values are J2000; mixing with B1875 / of-date coordinates is incorrect.
Magnitudes are V-band where available, single-value approximations of
integrated brightness for extended objects (M31, M42, M45 in particular
have brightness distributions that no single number describes well). M40
is a double-star asterism and M102's identification is disputed; both
standard published identifications are used.
"""

