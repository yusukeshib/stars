bytes = 145563
source = "https://cdsarc.cds.unistra.fr/viz-bin/cat/VI/49"
archive_id = "CDS VI/49 bound_18.dat"
citation = "Delporte 1930, Délimitation Scientifique des Constellations (IAU)."
license = "public-domain"
license_url = "https://cds.u-strasbg.fr/vizier/Documents/license.htx"
preprocessing = """
B1875 boundary vertices precessed to J2000 with the IAU 1976 precession
formula, then compacted at build time by `crates/renderer/build.rs` into
`constellation_boundaries.bin`.
"""
fields_used = ["x0", "y0", "z0", "x1", "y1", "z1"]
used_by = [
    "crates/renderer/build.rs",
    "crates/renderer/src/constellations.rs",
    "crates/renderer/src/overlay.rs",
]
limitations = """
Coordinate epoch is J2000; B1875 vertices must not be re-introduced. The
boundary set is the official IAU sky region division, suitable for "which
constellation does this RA/Dec belong to" lookups when paired with a
point-in-region test.
"""

