dates within the ±100-yr window, plus topocentric sites for diurnal-
parallax pins) is explicitly part of the precision-upgrade follow-up.
RA/Dec are quoted at Horizons's default precision (RA to 0.01 s, Dec
to 0.1″), which is ≈0.15″/0.1″ — comfortably under the ~5″
V-52c-TASS17 gate. The 2100 row will drift by milliarcseconds across
JPL kernel updates because JPL refines its future-state planetary
ephemerides as new observations land; rerun the regenerator and
update the SHA-256 when validating against a newer JPL kernel.
"""

