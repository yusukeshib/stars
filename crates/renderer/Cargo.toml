[package]
name = "renderer"
version = "0.1.0"
edition = "2021"

[dependencies]
astronomy = { path = "../astronomy" }
catalog = { path = "../catalog" }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }

[dev-dependencies]
# WGSL front-end + validator so `cargo test` (CPU-only CI) parses and
# validates the shaders without a GPU. Pinned to the same version wgpu uses.
naga = { version = "29", features = ["wgsl-in"] }
