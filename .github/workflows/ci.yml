name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. when a PR is pushed repeatedly).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Faster, smaller builds in CI: no incremental, trimmed debug info, robust networking.
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          # Only the main branch writes the cache; PRs read from it for fast warm starts
          # without thrashing the cache budget with branch-specific entries.
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Stable, job-distinct key so cache survives job renames and so the
          # parallel `test` job doesn't collide on save.
          shared-key: clippy
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: test
      - run: cargo test --no-fail-fast

  wasm:
    name: WASM Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          # apps/web is a separate workspace (excluded from the root one), so we
          # point rust-cache at its own target/ directory.
          workspaces: apps/web -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Dev-profile `cargo check` artifacts. Distinct from pages.yml's
          # release-profile cache to avoid mixing incompatible deps/ trees.
          shared-key: wasm-check
      - run: cargo check --target wasm32-unknown-unknown
        working-directory: apps/web

  frontend:
    name: Frontend Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
        working-directory: apps/web/frontend
      - run: bun run tsc --noEmit
        working-directory: apps/web/frontend
      # L-24 automated accessibility gate: axe-core (WCAG 2.2 A/AA) over the
      # interactive frontend components rendered in jsdom.
      - run: bun run test
        working-directory: apps/web/frontend
