name: Deploy Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/web -> target
          # Distinct from ci.yml's wasm key: this builds the `release` profile
          # via `wasm-pack build`, whose artifacts live in a different deps/
          # tree than ci.yml's dev-profile `cargo check`, so sharing a key
          # would only inflate the cache with no compile-time reuse.
          shared-key: wasm-release
          # This job runs only on main, so saving is always desired.
          save-if: 'true'

      # Install prebuilt binaries instead of `cargo install` (compiling from
      # source). The previous `cargo install wasm-pack && cargo install wasm-opt`
      # spent ~3–5 min compiling on every cache-miss run.
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      # `wasm-opt` is shipped as part of Binaryen. taiki-e/install-action does
      # not package it, so we fetch the official prebuilt release directly.
      # Binaryen `version_116` matches the `wasm-opt = 0.116.1` Rust wrapper
      # that was previously installed via `cargo install`.
      - name: Install wasm-opt (Binaryen)
        env:
          BINARYEN_VERSION: version_116
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-all-errors --show-error --silent \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_VERSION}/binaryen-${BINARYEN_VERSION}-x86_64-linux.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/binaryen-${BINARYEN_VERSION}/bin" >> "${GITHUB_PATH}"

      - name: Build WASM package
        run: wasm-pack build apps/web --target web --out-dir frontend/pkg

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
        working-directory: apps/web/frontend

      - name: Build frontend
        run: bun run build
        working-directory: apps/web/frontend
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/frontend/dist

  deploy:
    name: Deploy web
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
